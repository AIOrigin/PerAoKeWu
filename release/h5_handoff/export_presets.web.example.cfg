; 星火信使 · Web/H5 导出预设示例（Godot 4.4）
; 用法：
;   1. 复制到工程根目录，合并进 export_presets.cfg（或编辑器 Add → Web）
;   2. 确认已安装与编辑器同版本的 Export Templates（含 web_*）
;   3. Project → Export → Web → Export Project → 选 release/h5_handoff/build/index.html
; 说明：嵌入对方 iOS 壳的 WebView 时，通常关闭线程（无需 COOP/COEP）；若对方域名已配跨源隔离再开 thread。

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="**/_inbox/**,**/_pull_backup_*/**,**/blender-mcp/**,**/.godot/**,**/level_editor/**,**/docs/**,**/tools/**,**/_tools/**,**/release/**,**/glb-resouses/**,**/_inbox_tmp_*/**,**/_sky_ref/**,**/_video_frames*/**,**/.cursor/**,**/.tripo/**,**/_glb_pre_decimate_backup/**,**/Todo_Manager/**,**/script-ide/**,**/namespace_linker/**,**/runner_level_editor_launcher/**,**/capybara_rush/**,**/原版/**,**/_dev_reference/**,**/_texture_sidecars/**,**/panorama_relay_reference.png,**/panorama_relay_reference.png.import,**/water_station_source.png,**/defense_outpost_cutout.png,**/medical_outpost_cutout.png,**/*_basecolor.jpg,**/*_basecolor.png,**/*_BaseColor.jpg,**/*_normal.jpg,**/*_rm.jpg,**/*_rm.png,**/*metallic-*_roughness.png,**/*Metallic-*_roughness.png"
export_path="release/h5_handoff/build/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.02, 0.04, 0.08, 1)
threads/emscripten_pool_size=8
threads/godot_pool_size=4
